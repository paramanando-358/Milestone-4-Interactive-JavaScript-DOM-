<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Bubble</title>
    <style>
        body {
            border: 2px solid red;
            margin: 2px;
        }

        section {
            border: 2px solid green;
            margin: 2px;
        }

        ol {
            border: 2px solid blue;
            margin: 2px;
        }

        li {
            border: 2px solid brown;
            margin: 2px;
        }
    </style>
</head>

<body id="body">
    <h1>Explore Event bubble</h1>
    <section id="container">
        <h3>list of things</h3>
        <!-- ol>li#item*7>lorem2 -->
        <ol id ="list-item">
            <li id="item1">Lorem, ipsum.</li>
            <li id="item2">Quo, excepturi!</li>
            <li id="item3">Obcaecati, perspiciatis.</li>
            <li id="item4">Nostrum, modi.</li>
            <li id="item5">Corrupti, laboriosam!</li>
            <li id="item6">Debitis, commodi.</li>
            <li id="item7">Veniam, velit.</li>
        </ol>
    </section>
    <script>
        // list item2 clicked handler
        document.getElementById('item2')
            .addEventListener('click',function(event){
                console.log("item2 clicked");
                // event.stopPropagation();
                event.stopImmediatePropagation();
            })
        // list item2 clicked handler
        document.getElementById('item2')
            .addEventListener('click',function(event){
                console.log("item2 second clicked");
                // event.stopPropagation();
                // event.stopImmediatePropagation();
            })
        // list item2 clicked handler
        document.getElementById('item2')
            .addEventListener('click',function(event){
                console.log("item2 third clicked");
                // event.stopPropagation();
                // event.stopImmediatePropagation();
            })
        // ol clicked handler
        document.getElementById('list-item')
            .addEventListener('click',function(){
                console.log("ol clicked");
            })
        // Section clicked handler
        document.getElementById('container')
            .addEventListener('click',function(){
                console.log("Section clicked");
            })
        // body clicked handler
        document.getElementById('body')
            .addEventListener('click',function(){
                console.log("body clicked");
            })
    </script>
</body>

</html>
