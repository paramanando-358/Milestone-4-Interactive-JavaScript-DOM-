<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Github delete</title>
</head>
<body>
    <h1>My Secret Info</h1>
    <input id="input-delete" placeholder="write delete" type="text">
    <button id="delete-btn" disabled>Delete</button>
    <script>
        document.getElementById('input-delete')
        .addEventListener('keyup',function(event){
            const textI = event.target.value;
            // console.log("typing",textI);
            const btnDelete = document.getElementById('delete-btn');
            if(textI == 'delete'){
                console.log("Delete typed");
                btnDelete.removeAttribute('disabled');
                const secretTag = document.getElementById('secret-info');
                    secretTag.style.display = 'none';
            }
            else{
                console.log("Somethings else");
                btnDelete.setAttribute('disabled',true);
            }
        })
    </script>
</body>
</html>
